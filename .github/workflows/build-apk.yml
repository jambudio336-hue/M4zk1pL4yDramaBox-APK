name: Build & Release M4zk1pL4yDramaBox APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Root icon.png to Android App Icons
        run: |
          if [ -f "icon.png" ]; then
            echo "Menyalin icon.png dari root direktori ke resource Android..."
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp -f icon.png "$dir/ic_launcher.png"
                cp -f icon.png "$dir/ic_launcher_round.png"
                cp -f icon.png "$dir/ic_launcher_foreground.png"
              fi
            done
          else
            echo "icon.png belum ditemukan di root, memakai ikon default."
          fi

      - name: Enable Cleartext Traffic & Internet Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)"
          keytool -genkeypair -v \
            -keystore ../m4zk1pl4y-release.keystore \
            -alias m4zk1pl4y \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass M4zk1pL4y2026 \
            -keypass M4zk1pL4y2026 \
            -dname "CN=M4zk1pL4yDramaBox, OU=Dev, O=Mazkiplay, L=Banjarmasin, ST=KS, C=ID"

          "$BUILD_TOOLS/zipalign" -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            ../aligned-release.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks ../m4zk1pl4y-release.keystore \
            --ks-pass pass:M4zk1pL4y2026 \
            --key-pass pass:M4zk1pL4y2026 \
            --out ../M4zk1pL4yDramaBox-v1.0.0.apk \
            ../aligned-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: M4zk1pL4yDramaBox v1.0.${{ github.run_number }}
          body: |
            🎬 **M4zk1pL4yDramaBox — Public APK Release**
            - Sapaan pembuka: *Selamat datang di apk M4zk1pL4yDramaBox selamat menonton*
            - Integrasi penuh Melolo API & Multi-Provider DramaBox
            - Pemutar vertikal responsif, pemilih resolusi, riwayat tontonan & unduh episode
          files: M4zk1pL4yDramaBox-v1.0.0.apk
